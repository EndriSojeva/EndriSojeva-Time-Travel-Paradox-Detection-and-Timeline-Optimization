[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "timetravel-paradox"
version = "0.1.0"
description = "Academic framework for causal timeline analysis and repair"
requires-python = ">=3.11"
authors = [{name = "Endri Sojeva"}]
dependencies = [
  "networkx>=3.4,<4", "numpy>=2.1,<3", "matplotlib>=3.9,<4",
  "streamlit>=1.40,<2", "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jupyter>=1.1,<2", "nbformat>=5.10,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
